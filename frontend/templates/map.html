{% extends "base.html" %}
{% block content %}

<h2 class="fw-bold mb-3"><i class="bi bi-map"></i> Issues Map</h2>

<div id="map" style="height: 550px; border-radius: 10px;"></div>

<!-- Leaflet CSS -->
<link rel="stylesheet" 
  href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>

<!-- Marker Cluster -->
<link rel="stylesheet"
  href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
<link rel="stylesheet" 
  href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

<script>
// Issue data from Flask
const issues = {{ issues | tojson }};

// Default view - India center
let defaultView = [20.5937, 78.9629];
let defaultZoom = 5;

// Try to center on user's location or first issue with coordinates
const issueWithCoords = issues.find(i => i.latitude && i.longitude);
if (issueWithCoords) {
  defaultView = [parseFloat(issueWithCoords.latitude), parseFloat(issueWithCoords.longitude)];
  defaultZoom = 12;
}

// Initialize the map
const map = L.map('map').setView(defaultView, defaultZoom);

// Add OpenStreetMap tiles
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

// Custom icon
const customIcon = L.icon({
  iconUrl: 'https://cdn-icons-png.flaticon.com/512/684/684908.png',
  iconSize: [32, 32],
  iconAnchor: [16, 32],
  popupAnchor: [0, -32]
});

// Marker cluster group
const markers = L.markerClusterGroup();

// Add markers for each issue
issues.forEach(issue => {
  const popup = `
    <div style="min-width: 200px;">
      <h6 class="mb-1">${issue.title || 'Issue'}</h6>
      <p class="mb-1 small"><i class="bi bi-geo-alt"></i> ${issue.location || 'Location not specified'}</p>
      <p class="mb-1 small">
        <span class="badge bg-${issue.status === 'resolved' ? 'success' : issue.status === 'in-progress' ? 'primary' : 'warning'}">${issue.status || 'pending'}</span>
        <span class="ms-1"><i class="bi bi-hand-thumbs-up"></i> ${issue.upvotes || 0}</span>
      </p>
      <a href="/issues/view/${issue.id}" class="btn btn-primary btn-sm w-100">View Details</a>
    </div>
  `;

  // Use coordinates if available
  if (issue.latitude && issue.longitude) {
    const lat = parseFloat(issue.latitude);
    const lng = parseFloat(issue.longitude);
    if (!isNaN(lat) && !isNaN(lng)) {
      const marker = L.marker([lat, lng], {icon: customIcon}).bindPopup(popup);
      markers.addLayer(marker);
    }
  } else if (issue.location) {
    // Fallback: Use Nominatim geocoder
    fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(issue.location)}&limit=1`)
      .then(res => res.json())
      .then(data => {
        if (data && data.length > 0) {
          const lat = parseFloat(data[0].lat);
          const lon = parseFloat(data[0].lon);
          const marker = L.marker([lat, lon], {icon: customIcon}).bindPopup(popup);
          markers.addLayer(marker);
        }
      })
      .catch(err => console.error("Geocoding failed for", issue.location));
  }
});

// Add cluster to map
map.addLayer(markers);

// Fit bounds if we have markers
if (markers.getLayers().length > 0) {
  map.fitBounds(markers.getBounds(), {padding: [50, 50]});
}

</script>

{% endblock %}
