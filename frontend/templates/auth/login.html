{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">

    <div class="card shadow-sm border-0 rounded-4">
      <div class="card-body p-4">

        <h3 class="text-center fw-bold text-primary mb-3">
          Welcome Back
        </h3>
        <p class="text-center text-muted mb-4">
          Login to continue reporting issues.
        </p>

        <form id="loginForm" method="post" action="{{ url_for('auth.login') }}">
          <!-- Email -->
          <div class="mb-3">
            <label class="form-label fw-semibold"><i class="bi bi-envelope-fill"></i> Email</label>
            <input id="email" name="email" type="email" class="form-control p-3" placeholder="you@example.com" required>
          </div>

          <!-- Password -->
          <div class="mb-3">
            <label class="form-label fw-semibold"><i class="bi bi-lock-fill"></i> Password</label>
            <input id="password" name="password" type="password" class="form-control p-3" placeholder="Enter password" required>
          </div>

          <!-- Login Button -->
          <button type="submit" id="loginBtn" class="btn btn-primary w-100 py-2 fw-semibold rounded-3">
            Login
          </button>

          <div id="loginError" class="text-danger mt-3 small text-center" style="display:none;"></div>

          <div class="d-flex align-items-center my-4">
            <hr class="flex-grow-1">
            <span class="mx-2 text-muted small">OR</span>
            <hr class="flex-grow-1">
          </div>

          <button type="button" id="googleLoginBtn" class="btn btn-outline-dark w-100 py-2 fw-semibold rounded-3 d-flex align-items-center justify-content-center">
            <i class="bi bi-google text-danger me-2"></i> Continue with Google
          </button>
        </form>

      </div>
    </div>

    <p class="text-center mt-4">
      Don't have an account?
      <a href="{{ url_for('auth.register') }}" class="fw-bold text-primary">Register here</a>
    </p>

  </div>
</div>

<script type="module">
  import { signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  document.addEventListener('DOMContentLoaded', () => {
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const googleBtn = document.getElementById('googleLoginBtn');
    const errorDiv = document.getElementById('loginError');
    const auth = window.firebaseAuth || null;
    const firebaseReady = typeof signInWithEmailAndPassword === 'function' && typeof signInWithPopup === 'function' && typeof GoogleAuthProvider === 'function';

    async function sendTokenToBackend(idToken) {
        try {
            const res = await fetch('/auth/firebase-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ idToken })
            });
            const data = await res.json();
            if (data.success) {
                window.location.href = "{{ url_for('main.index') }}";
            } else {
                showError(data.error || 'Server error during login.');
            }
        } catch (e) {
            showError('Network error connecting to server.');
        }
    }

    function showError(msg) {
        errorDiv.textContent = msg;
        errorDiv.style.display = 'block';
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
        googleBtn.disabled = false;
    }

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        loginBtn.disabled = true;
        loginBtn.textContent = 'Authenticating...';
        errorDiv.style.display = 'none';

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if (!firebaseReady || !auth) {
            loginForm.method = 'post';
            loginForm.action = "{{ url_for('auth.login') }}";
            loginForm.submit();
            return;
        }

        try {
            const userCredential = await signInWithEmailAndPassword(auth, email, password);
            const idToken = await userCredential.user.getIdToken();
            await sendTokenToBackend(idToken);
        } catch (error) {
            showError("Firebase Error: " + error.message);
        }
    });

    googleBtn.addEventListener('click', async () => {
        googleBtn.disabled = true;
        errorDiv.style.display = 'none';
        if (!firebaseReady || !auth) {
            showError("Firebase is not configured for this page.");
            return;
        }
        const provider = new GoogleAuthProvider();
        try {
            const result = await signInWithPopup(auth, provider);
            const idToken = await result.user.getIdToken();
            await sendTokenToBackend(idToken);
        } catch (error) {
            showError("Google Auth Error: " + error.message);
        }
    });
  });
</script>

{% endblock %}
