{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">

    <div class="card shadow-sm border-0 rounded-4">
      <div class="card-body p-4">

        <h3 class="text-center fw-bold text-primary mb-3">
          Create Your Account
        </h3>
        <p class="text-center text-muted mb-4">
          Register using your email & password.
        </p>

        <form id="registerForm" method="post" action="{{ url_for('auth.register') }}">

          <!-- Full Name -->
          <div class="mb-3">
            <label class="form-label fw-semibold"><i class="bi bi-person-fill"></i> Full Name</label>
            <input id="name" name="name" type="text" class="form-control p-3" placeholder="Enter full name" required>
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label class="form-label fw-semibold"><i class="bi bi-envelope-fill"></i> Email Address</label>
            <input id="email" name="email" type="email" class="form-control p-3" placeholder="you@example.com" required>
          </div>

          <!-- Password -->
          <div class="mb-3">
            <label class="form-label fw-semibold"><i class="bi bi-lock-fill"></i> Password</label>
            <input id="password" name="password" type="password" class="form-control p-3" placeholder="Enter password (min 6 chars)" required minlength="6">
          </div>

          <!-- Submit Button -->
          <button type="submit" id="registerBtn" class="btn btn-primary w-100 py-2 fw-semibold rounded-3">
            Create Account
          </button>

          <div id="registerError" class="text-danger mt-3 small text-center" style="display:none;"></div>

        </form>

      </div>
    </div>

    <p class="text-center mt-4">
      Already have an account?
      <a href="{{ url_for('auth.login') }}" class="fw-bold text-primary">Login here</a>
    </p>

  </div>
</div>

<script type="module">
  import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  document.addEventListener('DOMContentLoaded', () => {
    const registerForm = document.getElementById('registerForm');
    const registerBtn = document.getElementById('registerBtn');
    const errorDiv = document.getElementById('registerError');
    const auth = window.firebaseAuth || null;
    const firebaseReady = typeof createUserWithEmailAndPassword === 'function';

    async function sendTokenToBackend(idToken, name) {
        try {
            const res = await fetch('/auth/firebase-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ idToken, name })
            });
            const data = await res.json();
            if (data.success) {
                window.location.href = "{{ url_for('main.index') }}";
            } else {
                showError(data.error || 'Server error during registration.');
            }
        } catch (e) {
            showError('Network error connecting to server.');
        }
    }

    function showError(msg) {
        errorDiv.textContent = msg;
        errorDiv.style.display = 'block';
        registerBtn.disabled = false;
        registerBtn.textContent = 'Create Account';
    }

    registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        registerBtn.disabled = true;
        registerBtn.textContent = 'Creating Account...';
        errorDiv.style.display = 'none';

        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if (!firebaseReady || !auth) {
            registerForm.method = 'post';
            registerForm.action = "{{ url_for('auth.register') }}";
            registerForm.submit();
            return;
        }

        try {
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            const idToken = await userCredential.user.getIdToken();
            await sendTokenToBackend(idToken, name);
        } catch (error) {
            showError("Firebase Error: " + error.message);
        }
    });
  });
</script>
{% endblock %}
